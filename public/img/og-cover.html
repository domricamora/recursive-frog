<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG cover</title>
<style>
    /* Mirrors resources/css/app.css so the cover stays in step with the site. */
    @font-face {
        font-family: 'Archivo';
        src: url('/build/assets/ARCHIVO_600') format('woff2');
        font-weight: 600;
    }
    @font-face {
        font-family: 'Archivo';
        src: url('/build/assets/ARCHIVO_500') format('woff2');
        font-weight: 500;
    }
    @font-face {
        font-family: 'JetBrains Mono';
        src: url('/build/assets/MONO_500') format('woff2');
        font-weight: 500;
    }

    :root {
        --bone-50: #fcfaf6;
        --ink-900: #121210;
        --ink-500: #5f5f53;
        --jade-400: #12b886;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        background: var(--bone-50);
        color: var(--ink-900);
        font-family: 'Archivo', sans-serif;
        overflow: hidden;
        position: relative;
    }

    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(to right, rgba(18,18,16,.055) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(18,18,16,.055) 1px, transparent 1px);
        background-size: 60px 60px;
    }

    .mark {
        position: absolute;
        left: 74px;
        top: 80px;
        display: flex;
        align-items: center;
        gap: 18px;
    }

    /* The supplied PNG, used as-is. It is a raster at its native jade, so
       the wordmark beside it carries the ink. Inlined as a data URI because
       the cover is rendered via setContent(), which has no base URL for a
       relative src to resolve against. */
    .mark img {
        height: 52px;
        width: auto;
        display: block;
    }

    .mark .word {
        font-family: 'Archivo', sans-serif;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--ink-900);
    }

    .mark sup {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-500);
        vertical-align: super;
    }

    .eyebrow {
        position: absolute;
        left: 74px;
        top: 236px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-500);
    }

    h1 {
        position: absolute;
        left: 70px;
        top: 276px;
        font-size: 84px;
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.04em;
    }
    h1 span { display: block; }
    h1 span:last-child { color: var(--jade-400); }

    footer {
        position: absolute;
        left: 74px;
        right: 74px;
        bottom: 46px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(18,18,16,.14);
        padding-top: 18px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-500);
    }
</style>
</head>
<body>
    <div class="grid"></div>

    <div class="mark">
        <img src="recursivefrog-logo.png" alt="" aria-hidden="true"><span class="word">RecursiveFrog</span>
        <sup>®</sup>
    </div>

    <p class="eyebrow">Digital systems for Cebu’s aesthetics clinics</p>

    <h1>
        <span>Build.</span>
        <span>Automate.</span>
        <span>Scale.</span>
    </h1>

    <footer>
        <span>recursivefrog.ph</span>
        <span>Cebu City</span>
    </footer>
</body>
</html>
